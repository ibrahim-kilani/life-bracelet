<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Bracelet | Predicting Danger Before It's Too Late</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#051527',
                        deep: '#0F2942',
                        accent: '#06B6D4',
                        aqua: '#F0F9FF'

                        sans: ['Plus Jakarta Sans', 'sans-serif'],

                }
            }

    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #051527; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }

        .draw-line { stroke-dasharray: 1000; animation: draw 3s ease-out forwards; }
        @keyframes ripple { 
            0% { transform: scale(0.8); opacity: 0.5; } 
            100% { transform: scale(2.5); opacity: 0; }

        .ripple-effect { animation: ripple 4s linear infinite; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #051527; }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- LOGO URL ---
        const LOGO_URL = "/logo.png";

        // --- HOOKS & UTILS ---
        const useInView = (options) => {
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setInView(true);
                        observer.unobserve(entry.target);
                    }
                }, options);
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return [ref, inView];
        };

        const Counter = ({ end, duration = 2000, prefix = "", suffix = "" }) => {
            const [count, setCount] = useState(0);
            const [ref, inView] = useInView({ threshold: 0.5 });
            useEffect(() => {
                if (!inView) return;
                let start = 0;
                const stepTime = 20;
                const steps = duration / stepTime;
                const inc = end / steps;
                const timer = setInterval(() => {
                    start += inc;
                    if (start >= end) {
                        setCount(end);
                        clearInterval(timer);
                    } else {
                        setCount(Math.floor(start));
                    }
                }, stepTime);
                return () => clearInterval(timer);
            }, [inView, end]);
            // FIX: Changed count.toLocale_string() to count.toLocaleString()
            return <span ref={ref}>{prefix}{count.toLocaleString()}{suffix}</span>;
        };

        // --- ICONS ---
        const Icon = ({ path, className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d={path} />
            </svg>
        );

        const Logo = () => {
            const [imgError, setImgError] = useState(false);
            if (imgError) {
                return (
                    <div className="flex items-center gap-2.5 text-white">
                        <svg viewBox="0 0 40 40" className="w-10 h-10" fill="none">
                            <path d="M4 20 Q10 10, 20 20 T36 20" stroke="#06B6D4" strokeWidth="2.5" strokeLinecap="round" />
                            <path d="M4 24 Q10 14, 20 24 T36 24" stroke="#0F2942" strokeWidth="2.5" strokeLinecap="round" opacity="0.8"/>
                            <path d="M6 18 L10 18 L12 14 L14 22 L16 16 L18 18 L22 18" stroke="#FFFFFF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                        </svg>
                        <div className="flex flex-col leading-none">
                            <span className="font-bold text-lg tracking-wide">LIFE BRACELET</span>
                            <span className="text-[10px] tracking-[0.2em] text-accent/80 uppercase">Safety that swim with you</span>
                        </div>
                    </div>
                );
            }
            return (
                <img 
                    src={LOGO_URL} 
                    alt="Life Bracelet Logo" 
                    className="h-10 md:h-14 w-auto object-contain" 
                    onError={() => setImgError(true)}
                />
            );
        };

        const icons = {
            detect: "M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 4v6l4 2",
            analyze: "M3 12h4l3-9 4 18 3-9h4",
            alert: "M12 2L1 21h22L12 2zm0 3l7.53 13H4.47L12 5zm-1 5h2v4h-2zm0 6h2v2h-2z",
            act: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
            human: "M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z",
            monitor: "M22 12h-4l-3 9L9 3l-3 9H2",
            wearable: "M6 2v6h12V2 M6 22v-6h12v6 M9 2h6v20H9z",
            arrow: "M5 12h14 M12 5l7 7-7 7",
            menu: "M3 12h18 M3 6h18 M3 18h18",
            close: "M18 6L6 18 M6 6l12 12",
            pool: "M2 20h20 M4 16c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 M6 16V6l3-2 M18 16V6l-3-2 M12 16V8 M9 4h6",
            chalet: "M3 12l9-9 9 9 M5 10v10h14V10 M9 20v-6h6v6 M3 21h18 M12 3v2 M10 5h4",
            check: "M5 13l4 4L19 7",
            chevronDown: "M19 9l-7 7-7-7"
        };

        // --- COMPONENTS ---

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 40);
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);
            const navLinks = ["Problem", "Solution", "How It Works", "Vision"];
            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? "bg-navy/90 backdrop-blur-lg border-b border-white/5 py-3" : "bg-transparent py-5"}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between">
                        <a href="#hero" className="flex-shrink-0"><Logo /></a>
                        <div className="hidden md:flex items-center gap-10">
                            {navLinks.map(link => (
                                <a key={link} href={`#${link.toLowerCase().replace(/\s/g, "-")}`} className="text-sm text-slate-300 hover:text-accent transition-colors duration-300 font-medium">{link}</a>
                            ))}
                        </div>
                        <a href="#contact" className="hidden md:block px-5 py-2.5 bg-accent text-navy text-sm font-semibold rounded-full hover:bg-cyan-300 transition-all duration-300 shadow-lg shadow-accent/20 hover:scale-105">Get in Touch</a>
                        <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden text-white">
                            {menuOpen ? <Icon path={icons.close} /> : <Icon path={icons.menu} />}
                        </button>
                    </div>
                    {menuOpen && (
                        <div className="md:hidden overflow-hidden bg-navy/95 backdrop-blur-lg border-t border-white/5 mt-3">
                            <div className="flex flex-col p-6 gap-4">
                                {navLinks.map(link => (
                                    <a key={link} href={`#${link.toLowerCase().replace(/\s/g, "-")}`} onClick={() => setMenuOpen(false)} className="text-slate-200 hover:text-accent transition-colors font-medium border-b border-white/5 pb-3">{link}</a>
                                ))}
                                <a href="#contact" onClick={() => setMenuOpen(false)} className="mt-2 px-5 py-3 bg-accent text-navy text-sm font-semibold rounded-full text-center">Get in Touch</a>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section id="hero" className="relative min-h-screen flex items-center justify-center overflow-hidden bg-navy">
                    <div className="absolute inset-0 z-0">
                        <div className="absolute inset-0 bg-gradient-to-br from-navy via-deep to-[#0F2942]"></div>
                        <div className="absolute top-1/4 -left-32 w-96 h-96 bg-accent/10 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-0 right-0 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>
                        <div className="absolute inset-0 opacity-[0.03]" style={{ backgroundImage: "linear-gradient(#22D3EE 1px, transparent 1px), linear-gradient(90deg, #22D3EE 1px, transparent 1px)", backgroundSize: "80px 80px" }}></div>
                    </div>
                    <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-12 grid lg:grid-cols-2 gap-12 items-center pt-32 pb-20">
                        <div className="flex flex-col gap-8">
                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-white/5 backdrop-blur-sm border border-accent/20 rounded-full w-fit">
                                <span className="w-2 h-2 bg-accent rounded-full animate-pulse"></span>
                                <span className="text-xs tracking-widest text-cyan-300 uppercase font-medium">AI-Powered Water Safety</span>
                            </div>
                            <h1 className="text-5xl lg:text-7xl font-bold text-white tracking-tight leading-[1.05]">
                                Predicting Danger <br />
                                <span className="bg-gradient-to-r from-cyan-300 to-blue-500 bg-clip-text text-transparent">Before It’s Too Late.</span>
                            </h1>
                            <p className="text-lg lg:text-xl text-slate-300 max-w-xl leading-relaxed">An AI-powered wearable designed to detect early signs of potential drowning and alert parents and lifeguards in time to act.</p>
                            <div className="flex flex-col sm:flex-row gap-4">
                                <a href="#contact" className="px-8 py-4 bg-accent text-navy font-semibold rounded-full hover:bg-cyan-300 transition-all duration-300 shadow-xl shadow-accent/20 hover:scale-[1.03] text-center">Join Our Early Access</a>
                                <a href="#problem" className="px-8 py-4 bg-transparent text-white font-semibold rounded-full border border-white/20 hover:bg-white/5 transition-all duration-300 text-center flex items-center justify-center gap-2 group">
                                    Learn About the Problem
                                    <Icon path={icons.chevronDown} className="w-4 h-4 group-hover:translate-y-1 transition-transform" />
                                </a>
                            </div>
                        </div>
                        
                        <div className="relative flex items-center justify-center h-[500px] md:h-[600px]">
                            <div className="relative w-full h-full flex items-center justify-center" style={{ perspective: '1000px' }}>
                                <div className="absolute w-3/4 h-3/4 bg-accent/20 blur-[100px] rounded-full"></div>
                                <div className="absolute bottom-10 w-1/2 h-8 bg-black/50 blur-2xl rounded-full"></div>
                                
                                <div className="relative float-animation" style={{ transform: 'rotateY(-15deg) rotateX(10deg) rotateZ(-5deg)' }}>
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-[450px] bg-gradient-to-b from-[#082243] via-[#0b2542] to-[#06172a] rounded-[4rem] border border-white/5 shadow-2xl shadow-black/50 z-0"></div>
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-[450px] bg-gradient-to-b from-[#0a2540] via-[#082243] to-[#071c30] rounded-[3.5rem] z-10 overflow-hidden">
                                        <div className="absolute inset-0 opacity-30 bg-gradient-to-r from-transparent via-white/5 to-transparent"></div>
                                        <div className="absolute inset-4 border border-white/5 rounded-[3rem]"></div>
                                        <div className="absolute inset-8 border border-white/5 rounded-[2.5rem]"></div>
                                    </div>

                                    <div className="relative z-20 w-56 h-72 rounded-[3rem] bg-gradient-to-br from-[#13293f] to-[#020812] border border-white/10 shadow-[0_20px_50px_-15px_rgba(0,0,0,0.8),inset_0_2px_5px_rgba(255,255,255,0.1),inset_0_-2px_5px_rgba(0,0,0,0.8)] p-2.5">
                                        <div className="relative w-full h-full bg-[#030c17] rounded-[2.5rem] overflow-hidden border border-cyan-500/10 flex flex-col items-center justify-center shadow-[inset_0_0_20px_rgba(6,182,212,0.15)]">
                                            <div className="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/10 to-transparent rounded-t-[2.5rem] pointer-events-none"></div>

                                            <div className="w-full flex justify-between items-center px-6 pt-5 z-10">
                                                <span className="text-[10px] text-cyan-400 font-bold tracking-[0.2em]">LIFE</span>
                                                <div className="flex gap-1 items-center">
                                                    <span className="w-1.5 h-1.5 bg-accent rounded-full animate-pulse"></span>
                                                    <span className="w-1.5 h-1.5 bg-accent/40 rounded-full"></span>
                                                </div>
                                            </div>
                                            
                                            <div className="flex-1 flex items-center justify-center z-10">
                                                <svg width="120" height="60" viewBox="0 0 120 60" fill="none">
                                                    <path d="M5 30 L25 30 L35 10 L50 50 L65 20 L80 30 L115 30" stroke="#22D3EE" strokeWidth="2.5" className="draw-line" />
                                                </svg>
                                            </div>
                                            
                                            <div className="w-full flex justify-center pb-5 z-10">
                                                 <div className="h-1.5 w-16 bg-cyan-500/30 rounded-full"></div>
                                            </div>

                                            {/* Water Droplets */}
                                            <div className="absolute top-12 right-8 w-2 h-2 bg-white/20 rounded-full blur-[0.5px] shadow-sm"></div>
                                            <div className="absolute top-14 right-12 w-1 h-1 bg-white/20 rounded-full blur-[0.5px]"></div>
                                            <div className="absolute bottom-20 left-10 w-3 h-3 bg-white/10 rounded-full blur-[0.5px] shadow-sm"></div>
                                            <div className="absolute bottom-24 left-16 w-1.5 h-1.5 bg-white/15 rounded-full blur-[0.5px]"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Problem = () => {
            const stats = [
                { value: 300000, prefix: "~", label: "Drowning deaths worldwide every year", source: "World Health Organization (WHO)" },
                { value: 92, suffix: "%", label: "Of drowning deaths occur in low- and middle-income countries", source: "World Health Organization" },
                { value: 5, prefix: "Nearly 1 in ", suffix: "", label: "Drowning deaths occur among children under 5", source: "WHO Global Estimate" }
            ];
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section id="problem" className="py-32 bg-aqua">
                    <div className="max-w-7xl mx-auto px-6 lg:px-12">
                        <div ref={ref} className={`max-w-3xl mb-20 transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                            <span className="text-accent font-semibold text-sm tracking-widest uppercase">The Problem</span>
                            <h2 className="text-4xl lg:text-5xl font-bold text-navy mt-4 tracking-tight">Drowning Can Happen in Minutes.</h2>
                            <p className="text-lg text-slate-600 mt-6 leading-relaxed">Drowning is a serious and often silent threat in aquatic environments. Recognizing danger early can provide a critical opportunity to respond.</p>
                        </div>
                        <div className="grid md:grid-cols-3 gap-8">
                            {stats.map((stat, i) => (
                                <div key={i} className={`bg-white p-8 rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-500 hover:-translate-y-2 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`} style={{ transitionDelay: `${i * 150}ms` }}>
                                    <h3 className="text-5xl font-bold text-deep mb-4 tracking-tight">
                                        {stat.prefix}<Counter end={stat.value} suffix={stat.suffix} />
                                    </h3>
                                    <p className="text-slate-600 leading-relaxed">{stat.label}</p>
                                    <div className="mt-6 pt-4 border-t border-slate-100">
                                        <p className="text-xs text-slate-400 uppercase tracking-wider font-medium">{stat.source}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <p className="mt-12 text-xs text-slate-400 max-w-2xl">Source: World Health Organization (WHO), Global status report on drowning prevention / Drowning fact sheet.</p>
                    </div>
                </section>
            );
        };

        const WhyDifficult = () => {
            const difficulties = [
                { title: "Human Attention", icon: icons.human, desc: "Continuous observation is difficult in busy swimming environments." },
                { title: "Conventional Monitoring", icon: icons.monitor, desc: "Many existing approaches rely on recognizing an incident after it has already started." },
                { title: "General Wearables", icon: icons.wearable, desc: "Most consumer wearables are not specifically designed around drowning-risk detection." }
            ];
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section className="py-32 bg-white">
                    <div className="max-w-7xl mx-auto px-6 lg:px-12">
                        <div ref={ref} className={`max-w-3xl mb-16 transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                            <h2 className="text-4xl lg:text-5xl font-bold text-navy tracking-tight">Traditional Water Safety Is Reactive.</h2>
                            <p className="text-lg text-slate-600 mt-6 leading-relaxed">Parents and lifeguards rely heavily on constant observation. But human attention can be limited, especially when multiple swimmers are present.</p>
                        </div>
                        <div className="grid md:grid-cols-3 gap-8 mb-24">
                            {difficulties.map((item, i) => (
                                <div key={i} className={`p-8 rounded-3xl bg-slate-50 hover:bg-white border border-slate-100 transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl hover:shadow-slate-200/50 group ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`} style={{ transitionDelay: `${i * 150}ms` }}>
                                    <div className="w-12 h-12 rounded-2xl bg-cyan-100 flex items-center justify-center mb-6 group-hover:bg-accent transition-colors duration-500">
                                        <Icon path={item.icon} className="w-6 h-6 text-accent group-hover:text-white transition-colors duration-500" />
                                    </div>
                                    <h3 className="text-xl font-bold text-navy mb-3">{item.title}</h3>
                                    <p className="text-slate-500 leading-relaxed">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                        <div className={`text-center max-w-4xl mx-auto transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`} style={{ transitionDelay: '300ms' }}>
                            <p className="text-2xl md:text-3xl font-semibold text-deep leading-relaxed">What if technology could help identify potential danger before it becomes an emergency?</p>
                            <div className="w-24 h-1 bg-accent mx-auto mt-12 rounded-full"></div>
                        </div>
                    </div>
                </section>
            );
        };

        const Solution = () => {
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section id="solution" className="py-32 bg-navy relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-96 h-96 bg-accent/10 rounded-full blur-[150px]"></div>
                    <div ref={ref} className={`max-w-7xl mx-auto px-6 lg:px-12 relative z-10 grid lg:grid-cols-2 gap-16 items-center transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                        <div>
                            <span className="text-accent font-semibold text-sm tracking-widest uppercase">The Solution</span>
                            <h2 className="text-4xl lg:text-5xl font-bold text-white mt-4 tracking-tight">Meet Life Bracelet</h2>
                            <p className="text-lg text-slate-300 mt-6 leading-relaxed">Life Bracelet is an AI-powered wearable being developed specifically for swimming environments, designed to identify early signs of potential drowning and provide timely alerts to parents and lifeguards.</p>
                        </div>
                        <div className="bg-gradient-to-br from-white/5 to-transparent p-10 rounded-3xl border border-white/10 backdrop-blur-sm">
                            <div className="flex flex-col gap-6">
                                <div className="flex items-start gap-4">
                                    <div className="w-10 h-10 rounded-full bg-accent/20 border border-accent/50 flex items-center justify-center shrink-0">
                                        <div className="w-2 h-2 bg-accent rounded-full animate-pulse"></div>
                                    </div>
                                    <div>
                                        <h4 className="text-white font-semibold text-lg">Dedicated Safety Device</h4>
                                        <p className="text-slate-400 text-sm mt-1">Engineered exclusively for aquatic environments, not a modified fitness tracker.</p>
                                    </div>
                                </div>
                                <div className="flex items-start gap-4">
                                    <div className="w-10 h-10 rounded-full bg-accent/20 border border-accent/50 flex items-center justify-center shrink-0">
                                        <Icon path="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" className="w-5 h-5 text-accent" />
                                    </div>
                                    <div>
                                        <h4 className="text-white font-semibold text-lg">AI-Powered Analysis</h4>
                                        <p className="text-slate-400 text-sm mt-1">Aiming to provide an intelligent layer of protection through continuous monitoring.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const HowItWorks = () => {
            const steps = [
                { title: "Detect", desc: "Identify patterns that may indicate potential danger.", icon: icons.detect },
                { title: "Analyze", desc: "AI continuously evaluates the situation.", icon: icons.analyze },
                { title: "Alert", desc: "Parents and lifeguards receive a timely alert.", icon: icons.alert },
                { title: "Act", desc: "Providing an opportunity to respond earlier.", icon: icons.act }
            ];
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section id="how-it-works" className="py-32 bg-aqua">
                    <div className="max-w-7xl mx-auto px-6 lg:px-12">
                        <div ref={ref} className={`text-center max-w-3xl mx-auto mb-24 transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                            <span className="text-accent font-semibold text-sm tracking-widest uppercase">The Process</span>
                            <h2 className="text-4xl lg:text-5xl font-bold text-navy mt-4 tracking-tight">How It Works</h2>
                        </div>
                        <div className="grid md:grid-cols-4 gap-8 relative">
                            <div className="hidden md:block absolute top-12 left-[12.5%] right-[12.5%] h-0.5 bg-gradient-to-r from-cyan-200 via-accent to-cyan-200"></div>
                            {steps.map((step, i) => (
                                <div key={i} className={`relative flex flex-col items-center text-center transition-all duration-700 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`} style={{ transitionDelay: `${i * 150}ms` }}>
                                    <div className="w-24 h-24 rounded-full bg-white border-2 border-accent shadow-lg shadow-cyan-100 flex items-center justify-center mb-6 relative z-10">
                                        <Icon path={step.icon} className="w-8 h-8 text-deep" />
                                    </div>
                                    <h3 className="text-xl font-bold text-navy mb-2">{step.title}</h3>
                                    <p className="text-slate-500 leading-relaxed text-sm max-w-[200px]">{step.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const TargetEnvironments = () => {
            const envs = [
                { title: "Indoor Swimming Pools", desc: "Adding an intelligent layer of safety to swimming facilities.", icon: icons.pool, img: "https://images.unsplash.com/photo-1572985789280-95b28d0485d4?q=80&w=2070&auto=format&fit=crop" },
                { title: "Chalet & Private Pools", desc: "Helping families add another layer of protection around private swimming environments.", icon: icons.chalet, img: "https://images.unsplash.com/photo-1604014237959-4943b4b5f2d0?q=80&w=2070&auto=format&fit=crop" }
            ];
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section className="py-32 bg-white">
                    <div ref={ref} className={`max-w-7xl mx-auto px-6 lg:px-12 grid md:grid-cols-2 gap-8 transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                        {envs.map((env, i) => (
                            <div key={i} className="relative h-[450px] rounded-3xl overflow-hidden group border border-slate-100 shadow-sm">
                                <img src={env.img} alt={env.title} className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                <div className="absolute inset-0 bg-gradient-to-t from-navy via-navy/80 to-transparent z-10"></div>
                                <div className="absolute bottom-0 left-0 right-0 p-10 z-20">
                                    <div className="w-14 h-14 rounded-2xl bg-accent/90 backdrop-blur-sm flex items-center justify-center mb-6 shadow-xl group-hover:scale-110 transition-transform duration-500">
                                        <Icon path={env.icon} className="w-7 h-7 text-navy" />
                                    </div>
                                    <h3 className="text-2xl font-bold text-white mb-3">{env.title}</h3>
                                    <p className="text-slate-300 max-w-md">{env.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Vision = () => {
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section id="vision" className="relative py-48 bg-navy overflow-hidden flex items-center justify-center">
                    <div className="absolute inset-0 z-0 opacity-30">
                        <div className="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-accent/5 to-transparent"></div>
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 border border-accent/20 rounded-full ripple-effect"></div>
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 border border-accent/20 rounded-full ripple-effect" style={{ animationDelay: '2s' }}></div>
                    </div>
                    <div ref={ref} className={`relative z-10 max-w-5xl mx-auto px-6 text-center transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                        <span className="text-accent font-semibold text-sm tracking-[0.3em] uppercase mb-10 block">
                            Our Vision
                        </span>
                        <h2 className="text-5xl md:text-7xl font-bold text-white tracking-tight leading-[1.1] mb-12">
                            Making Water Safety <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-accent">Smarter.</span>
                        </h2>
                        <p className="text-xl md:text-2xl text-slate-300 font-light leading-relaxed max-w-3xl mx-auto">
                            We’re building technology that helps identify potential danger earlier — giving parents and lifeguards more time to act.
                        </p>
                    </div>
                </section>
            );
        };

        const Roadmap = () => {
            const stages = [
                { title: "Prototype Development", status: "current" },
                { title: "Testing & Validation", status: "upcoming" },
                { title: "Pilot Programs", status: "upcoming" },
                { title: "Market Launch", status: "upcoming" }
            ];
            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            return (
                <section className="py-32 bg-aqua">
                    <div className="max-w-7xl mx-auto px-6 lg:px-12">
                        <div ref={ref} className={`text-center max-w-3xl mx-auto mb-20 transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                            <span className="text-accent font-semibold text-sm tracking-widest uppercase">Current Stage</span>
                            <h2 className="text-4xl lg:text-5xl font-bold text-navy mt-4 tracking-tight">We're Building the Future of Water Safety.</h2>
                            <p className="text-lg text-slate-600 mt-6 leading-relaxed">Life Bracelet is currently in the product development and validation stage.</p>
                        </div>
                        <div className="grid md:grid-cols-4 gap-4">
                            {stages.map((stage, i) => (
                                <div key={i} className={`relative p-8 rounded-3xl border transition-all duration-700 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${stage.status === "current" ? "bg-navy border-accent/30 shadow-2xl shadow-accent/10" : "bg-white border-slate-100"}`} style={{ transitionDelay: `${i * 150}ms` }}>
                                    <div className={`w-3 h-3 rounded-full mb-6 ${stage.status === "current" ? "bg-accent animate-pulse" : "bg-slate-200"}`}></div>
                                    <h3 className={`text-lg font-bold ${stage.status === "current" ? "text-white" : "text-slate-400"}`}>{stage.title}</h3>
                                    {stage.status === "current" && (
                                        <span className="mt-4 inline-block text-xs font-medium tracking-wider uppercase text-cyan-300 bg-accent/10 px-3 py-1 rounded-full">We are here</span>
                                    )}
                                    {i < stages.length - 1 && (
                                        <div className="hidden md:block absolute top-1/2 -right-3 transform -translate-y-1/2 text-slate-300 z-10">
                                            <Icon path={icons.arrow} className="w-6 h-6" />
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            const [submitted, setSubmitted] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(false);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError(false);

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch("https://formspree.io/f/xvkpwllp", {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        setSubmitted(true);
                    } else {
                        setError(true);
                    }
                } catch (err) {
                    setError(true);
                } finally {
                    setIsLoading(false);
                }
            };

            const [ref, inView] = useInView({ once: true, margin: "-100px" });
            
            return (
                <section id="contact" className="py-32 bg-navy relative overflow-hidden">
                    <div className="absolute top-1/4 left-0 w-96 h-96 bg-accent/10 rounded-full blur-[150px]"></div>
                    <div ref={ref} className={`max-w-6xl mx-auto px-6 lg:px-12 relative z-10 grid lg:grid-cols-2 gap-16 items-center transition-all duration-1000 ${inView ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                        <div>
                            <h2 className="text-4xl lg:text-5xl font-bold text-white tracking-tight leading-tight">Interested in the Future of Water Safety?</h2>
                            <p className="text-lg text-slate-300 mt-6 leading-relaxed">We are currently connecting with investors, strategic partners, swimming facilities, and chalet operators who believe technology can help create safer swimming environments.</p>
                        </div>
                        <div className="bg-white/5 backdrop-blur-lg border border-white/10 p-10 rounded-3xl">
                            {!submitted ? (
                                <form onSubmit={handleSubmit} className="flex flex-col gap-6">
                                    <div>
                                        <label className="text-sm text-slate-300 mb-2 block">Full Name</label>
                                        <input required type="text" name="name" className="w-full bg-transparent border-b border-white/20 text-white py-3 focus:outline-none focus:border-accent transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-300 mb-2 block">Email Address</label>
                                        <input required type="email" name="email" className="w-full bg-transparent border-b border-white/20 text-white py-3 focus:outline-none focus:border-accent transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-300 mb-2 block">Company / Organization <span className="text-slate-500">(Optional)</span></label>
                                        <input type="text" name="company" className="w-full bg-transparent border-b border-white/20 text-white py-3 focus:outline-none focus:border-accent transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-300 mb-2 block">I’m Interested In</label>
                                        <select required name="interest" className="w-full bg-transparent border-b border-white/20 text-white py-3 focus:outline-none focus:border-accent transition-colors appearance-none">
                                            <option value="" disabled selected className="bg-navy">Please select...</option>
                                            <option className="bg-navy">Investment</option>
                                            <option className="bg-navy">Partnership</option>
                                            <option className="bg-navy">Pilot Program</option>
                                            <option className="bg-navy">Early Access</option>
                                            <option className="bg-navy">Other</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-300 mb-2 block">Message <span className="text-slate-500">(Optional)</span></label>
                                        <textarea name="message" rows={3} className="w-full bg-transparent border-b border-white/20 text-white py-3 focus:outline-none focus:border-accent transition-colors resize-none"></textarea>
                                    </div>
                                    
                                    {error && (
                                        <p className="text-red-400 text-sm text-center bg-red-500/10 border border-red-500/20 py-2 rounded-lg">
                                            Something went wrong. Please try again.
                                        </p>
                                    )}

                                    <button 
                                        type="submit" 
                                        disabled={isLoading} 
                                        className={`mt-4 px-8 py-4 bg-accent text-navy font-semibold rounded-full transition-all duration-300 shadow-xl shadow-accent/20 flex items-center justify-center gap-3 ${isLoading ? 'opacity-75 cursor-not-allowed' : 'hover:bg-cyan-300 hover:scale-[1.02]'}`}
                                    >
                                        {isLoading ? (
                                            <>
                                                <svg className="animate-spin h-5 w-5 text-navy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Sending...
                                            </>
                                        ) : (
                                            "Connect With Life Bracelet"
                                        )}
                                    </button>
                                </form>
                            ) : (
                                <div className="flex flex-col items-center justify-center text-center h-full py-20">
                                    <div className="w-20 h-20 rounded-full bg-accent/20 border border-accent flex items-center justify-center mb-8">
                                        <Icon path={icons.check} className="w-10 h-10 text-accent" />
                                    </div>
                                    <h3 className="text-2xl font-bold text-white mb-3">Thank you for your interest in Life Bracelet.</h3>
                                    <p className="text-slate-300">We’ll be in touch soon.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-[#020D18] py-16 border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-8">
                    <div className="flex flex-col items-center md:items-start gap-4">
                        <Logo />
                        <p className="text-sm text-slate-500">Making water safety smarter.</p>
                    </div>
                    <div className="flex gap-6">
                        <a href="#" className="text-slate-400 hover:text-accent transition-colors"><Icon path="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" className="w-5 h-5" /></a>
                        <a href="#" className="text-slate-400 hover:text-accent transition-colors"><Icon path="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z M2 9h4v12H2z M4 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" className="w-5 h-5" /></a>
                    </div>
                </div>
            </footer>
        );

        // --- MAIN APP ---
        const App = () => {
            return (
                <main className="bg-white overflow-x-hidden antialiased">
                    <Navbar />
                    <Hero />
                    <Problem />
                    <WhyDifficult />
                    <Solution />
                    <HowItWorks />
                    <TargetEnvironments />
                    <Vision />
                    <Roadmap />
                    <Contact />
                    <Footer />
                </main>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
